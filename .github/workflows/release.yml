name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for npm trusted publishing: lets the job mint the OIDC token
      # npm exchanges for short-lived publish credentials. No NPM_TOKEN needed.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1. Node 24 ships an 11.x, but the
      # exact minor varies by runner image, so pin the floor explicitly.
      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          node --version && npm --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pkg="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$pkg" ]; then
            echo "::error::tag $TAG does not match package.json version $pkg"
            exit 1
          fi
          echo "publishing react-driller@$pkg"

      - name: Check
        run: bun run check

      # `prepublishOnly` runs the bun build, so dist/ is produced here.
      # Provenance is attached automatically when publishing via OIDC.
      - name: Publish
        run: npm publish
